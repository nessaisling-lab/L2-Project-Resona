[package]
name = "resona"
version = "0.1.0"
authors = ["Aisling Leiva <aisling.ld@pursuit.org>", "Jimmy Ong <jimmy.ong@pursuit.org>"]
description = "Local-first voice-to-text with live dictation and grammar review"
edition = "2021"

[lib]
name = "resona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Build-graph fix: tauri-build -> schemars 0.8 pulls indexmap 1.x with its `std`
# feature off, which drops IndexMap's default hasher (S = RandomState) and breaks
# schemars' `Map<K, V>` alias (E0107: 3 generic args needed, 2 supplied). Forcing
# `std` on for the shared build-dep copy restores the default. Not used directly.
indexmap = { version = "1", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust bindings to whisper.cpp. Verify the newest version with `cargo add whisper-rs`.
# Enable a GPU backend feature for production speed, e.g. features = ["metal"] on macOS,
# ["cuda"] on NVIDIA, ["vulkan"] cross-platform. Default builds CPU-only.
whisper-rs = "0.16"
cpal = "0.15"
anyhow = "1"
parking_lot = "0.12"

[dev-dependencies]
# WAV reader for the env-gated transcription integration test in whisper.rs.
hound = "3"

[profile.release]
opt-level = 3
lto = true
